<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&family=Comfortaa:wght@300..700&family=JetBrains+Mono:wght@100..800&display=swap"
			rel="stylesheet"
		/>

		<!-- 頁面是預先渲染的靜態 HTML，主題必須在首次繪製前決定，否則深色使用者會看到一閃而過的淺色底 -->
		<script>
			try {
				var saved = localStorage.getItem("theme");
				var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
				document.documentElement.dataset.theme = saved === "dark" || saved === "light" ? saved : prefersDark ? "dark" : "light";
			} catch (e) {
				document.documentElement.dataset.theme = "light";
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
